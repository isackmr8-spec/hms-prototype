<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Records - HMS</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">HMS Prototype</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="patient-registration.html">Patient Registration</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="doctor-management.html">Doctor Management</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="appointment.html">Appointment</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="medical-records.html">Medical Records</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="billing.html">Billing</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="pharmacy.html">Pharmacy</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        <h2>Medical Records</h2>
        <form id="medicalForm">
            <div class="mb-3">
                <label for="patientId" class="form-label">Patient ID</label>
                <input type="text" class="form-control" id="patientId" placeholder="Enter Patient ID" required>
            </div>
            <div class="mb-3">
                <label for="patientHistory" class="form-label">Patient History</label>
                <textarea class="form-control" id="patientHistory" rows="3" placeholder="Enter patient history"></textarea>
            </div>
            <div class="mb-3">
                <label for="diagnosis" class="form-label">Diagnosis</label>
                <textarea class="form-control" id="diagnosis" rows="3" placeholder="Enter diagnosis"></textarea>
            </div>
            <div class="mb-3">
                <label for="testResults" class="form-label">Test Results</label>
                <textarea class="form-control" id="testResults" rows="3" placeholder="Enter test results"></textarea>
            </div>
            <div class="mb-3">
                <label for="prescriptions" class="form-label">Prescriptions</label>
                <textarea class="form-control" id="prescriptions" rows="3" placeholder="Enter prescriptions"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Save Record</button>
        </form>
        <h3 class="mt-5">Recent Records</h3>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Patient ID</th>
                    <th>Diagnosis</th>
                    <th>Prescriptions</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="recordsTable">
                <!-- Sample row -->
                <tr>
                    <td>P001</td>
                    <td>Hypertension</td>
                    <td>Lisinopril 10mg</td>
                    <td><button class="btn btn-sm btn-info">View</button></td>
                </tr>
            </tbody>
        </table>
    </div>
    <script>
        document.getElementById('medicalForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const patientId = document.getElementById('patientId').value;
            const diagnosis = document.getElementById('diagnosis').value;
            const prescriptions = document.getElementById('prescriptions').value;
            const table = document.getElementById('recordsTable');
            const row = table.insertRow();
            row.innerHTML = `<td>${patientId}</td><td>${diagnosis}</td><td>${prescriptions}</td><td><button class="btn btn-sm btn-info">View</button></td>`;
            alert('Medical record saved successfully!');
            document.getElementById('medicalForm').reset();
        });
    </script>
</body>
</html>
