<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing System - HMS</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">HMS Prototype</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="patient-registration.html">Patient Registration</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="doctor-management.html">Doctor Management</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="appointment.html">Appointment</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="medical-records.html">Medical Records</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="billing.html">Billing</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="pharmacy.html">Pharmacy</a>
                    </li>

                        <a class="nav-link" href="login.html">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        <h2>Billing System</h2>
        <form id="billingForm">
            <div class="mb-3">
                <label for="consultationFee" class="form-label">Consultation Fee</label>
                <input type="number" class="form-control" id="consultationFee" step="0.01" required>
            </div>
            <div class="mb-3">
                <label for="labCharges" class="form-label">Lab Charges</label>
                <input type="number" class="form-control" id="labCharges" step="0.01" required>
            </div>
            <div class="mb-3">
                <label for="medicineCost" class="form-label">Medicine Cost</label>
                <input type="number" class="form-control" id="medicineCost" step="0.01" required>
            </div>
            <div class="mb-3">
                <label for="totalAmount" class="form-label">Total Amount</label>
                <input type="number" class="form-control" id="totalAmount" readonly>
            </div>
            <div class="mb-3">
                <label for="paymentStatus" class="form-label">Payment Status</label>
                <select class="form-control" id="paymentStatus" required>
                    <option value="">Select Status</option>
                    <option value="paid">Paid</option>
                    <option value="pending">Pending</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Generate Bill</button>
        </form>
    </div>
    <script>
        function calculateTotal() {
            const consultation = parseFloat(document.getElementById('consultationFee').value) || 0;
            const lab = parseFloat(document.getElementById('labCharges').value) || 0;
            const medicine = parseFloat(document.getElementById('medicineCost').value) || 0;
            const total = consultation + lab + medicine;
            document.getElementById('totalAmount').value = total.toFixed(2);
        }

        document.getElementById('consultationFee').addEventListener('input', calculateTotal);
        document.getElementById('labCharges').addEventListener('input', calculateTotal);
        document.getElementById('medicineCost').addEventListener('input', calculateTotal);

        document.getElementById('billingForm').addEventListener('submit', function(event) {
            event.preventDefault();
            alert('Bill generated successfully!');
        });
    </script>
</body>
</html>
